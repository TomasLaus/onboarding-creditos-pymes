openapi: 3.0.0
info:
  title: Auth API
  description: API de autenticación para sistema de créditos PyMES
  version: 1.0.0
  user history:
    - version: 1.0.0
      description: Versión inicial de la API
      codigo: US 2 – Inicio de sesión
      casos:  	Solo acceden usuarios activados.
	    Mensaje genérico en credenciales inválidas.
     	Máx. 5 intentos fallidos → bloqueo 15 min.
        JWT expira segun valor de variable de entorno
        verificaicon con email y password erroneos
        verifiaccion con usuario no activado
        verificacion con usuario bloqueado(campo loked until)
        verificacion segun rol de usuario
        graba intentos fallidos (loginAttempts)
        graba ultimo acceso
        al loguear genera token

paths:
  /api/auth/login:
    post:
      summary: Autenticación de usuario
      description: Permite a usuarios PyME iniciar sesión en el sistema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: empresa@test.com
                password:
                  type: string
                  format: password
                role:
                  type: string
                  enum: [PYME, ADMIN]
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        ''401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Credenciales inválidas"
                    "Credenciales incorrectas. Cuenta desactivada"
                    "Cuenta bloqueada. Intenta nuevamente en 15 minutos""

  /api/health:
    get:
      summary: Health Check
      description: Verifica el estado y disponibilidad del servicio
      responses:
        '200':
          description: Servicio funcionando correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "OK"
                  timestamp:
                    type: string
                    format: date-time
                    example: "2025-10-07T10:00:00Z"

  /api/auth/verify:
    get:
      summary: Verificación de Token
      description: Verifica la validez del token JWT proporcionado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token válido
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: true
                  user:
                    type: object
                    properties:
                      email:
                        type: string
                        example: "empresa@test.com"
                      role:
                        type: string
                        example: "PYME"
        '401':
          description: Token inválido o expirado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Token inválido o expirado"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT