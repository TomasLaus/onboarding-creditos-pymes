# Nombre del workflow
name: Scrum Dashboard Automation

# Triggers
on:
  issues:
    types:
      - labeled     
      - milestoned  

# Jobs
jobs:
  automate-scrum-dashboard:
    runs-on: ubuntu-latest
    steps:
      # AUTOMATIZACIÓN 1: Añadir issue con etiqueta 'story' al backlog
      - name: Add 'story' issues to backlog
        if: github.event.action == 'labeled' && github.event.label.name == 'story'
        uses: alex-page/github-project-automation-plus@v0.8.3
        with:
          project: onboarding-pymes-nocountry        
          column: Backlog                 
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # AUTOMATIZACIÓN 2: Mover issue a 'sprint backlog' al asignarlo a un milestone
      - name: Move issue to sprint backlog when milestoned
        if: github.event.action == 'milestoned'
        uses: alex-page/github-project-automation-plus@v0.8.3
        with:
          project: onboarding-pymes-nocountry        
          column: Sprint Backlog          
          repo-token: ${{ secrets.GITHUB_TOKEN }}
