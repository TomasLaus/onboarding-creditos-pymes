# Nombre del workflow
name: Task Dashboard Automation

# Triggers
on:
  issues:
    types:
      - labeled     
      - assigned  

# Jobs
jobs:
  automate-task-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Add or Move Issue in Project
        uses: srggrs/assign-one-project-github-action@v1.3.1
        if: |
          (github.event.action == 'labeled' && github.event.label.name == 'task') ||
          (github.event.action == 'assigned')
        with:
          project-url: "https://github.com/users/TomasLaus/projects/1"
          
          github-token: ${{ secrets.PROJECT_TOKEN }}
          
          column_name: ${{ (github.event.action == 'assigned' && 'Task to do') || 'Task Backlog' }}
